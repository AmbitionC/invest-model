name: index-dump

# 指数全历史日线导出（通用一次性分析工具）。trigger 文件首行写逗号分隔指数代码，
# tushare 拉全历史收盘 → results/index_dump_<code>.csv git 回吐 master 供本地分析。
# 触发：手动 / 改 ops/index-dump.trigger 后 push（仅 master）。

on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - 'ops/index-dump.trigger'

concurrency:
  group: index-dump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_HTTP_URL: ${{ secrets.TUSHARE_HTTP_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e .
      - name: 导出指数全历史
        timeout-minutes: 10
        run: |
          CODES=$(grep -oE '^[0-9A-Z]{6}\.[A-Z]{2,3}(,[0-9A-Z]{6}\.[A-Z]{2,3})*' ops/index-dump.trigger | head -1)
          python scripts/analysis/index_history_dump.py --codes "$CODES"
      - name: 提交结果回 master
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add -f results/index_dump_*.csv
          git commit -m "分析产物：指数全历史导出 [skip ci]" || echo "无变化"
          git push
