name: index-spread

# 近五年 创业板指−上证综指 点差序列导出（用户命题·一次性分析）。
# 只读 index_daily；跑完把 results/index_spread_5y.csv 提交回 master 供 Claude 本地渲染
# （本环境 job 日志下载常 404，用 git 回吐数据最稳）。
# 触发：手动 / 改 ops/index-spread.trigger 后 push（仅 master）。

on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - 'ops/index-spread.trigger'

concurrency:
  group: index-spread
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INVEST_DB_URL: ${{ secrets.INVEST_DB_URL }}
      MYSQL_HOST: ${{ secrets.DB_HOST }}
      MYSQL_USER: ${{ secrets.DB_USER }}
      MYSQL_PASSWORD: ${{ secrets.DB_PASS }}
      MYSQL_DATABASE: ${{ vars.INVEST_DB_NAME || 'invest' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e .
      - name: 导出点差序列
        timeout-minutes: 5
        run: python scripts/analysis/index_spread_dump.py --out results/index_spread_5y.csv
      - name: 提交结果 CSV 回 master
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add -f results/index_spread_5y.csv
          git commit -m "分析产物：近五年创业板指−上证点差序列 [skip ci]" || echo "无变化"
          git push
      - name: Upload artifact（兜底）
        uses: actions/upload-artifact@v4
        with:
          name: index-spread
          path: results/index_spread_5y.csv
          if-no-files-found: warn
